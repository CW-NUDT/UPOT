name: upot
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=12.1
  - pip
  - pip:
      - POT>=0.9.0
      - torchmetrics>=0.10.0
      - scikit-learn>=1.2.0
      - scipy>=1.9.0
      - numpy>=1.22.0
      - matplotlib>=3.6.0
      - tqdm>=4.64.0
      - Pillow>=9.0.0
